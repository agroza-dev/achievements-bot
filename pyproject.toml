[project]
name = "old-hustler-bot"
version = "0.1.0"
description = "Telegram bot for group entertainment"
authors = [{name = "Your Name", email = "you@example.com"}]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-telegram-bot>=22.5",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.2",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.18",
    "psycopg2-binary>=2.9.11",
    "setuptools>=82.0.0",
    "pymorphy3>=2.0.6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "black>=24.10.0",
    "testcontainers>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "database", "bot"]

[tool.ruff]
line-length = 120
target-version = "py314"
# Исключение файлов и папок
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
    "SIM", # lake8-simplify
]
fixable = ["ALL"]
unfixable = []
ignore = [
    "E501",  # line too long (handled by line-length)
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["core", "database", "bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (requires Docker)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.10",
    "testcontainers>=4.14.1",
]
